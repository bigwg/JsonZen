server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # HashRouter 下无需 history fallback，这里仅作兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止缓存 index.html，保证更新即时生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
